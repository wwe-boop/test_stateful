# =============================================================================
# Qwen3-TTS Engine Configuration
# =============================================================================
# Model architecture is auto-loaded from triton_manifest.json in engine_dir.
# This file contains engine deployment paths + runtime parameters.
#
# Priority:
#   Engine params:  CLI args (debug) > ENGINE_* env > engine.yaml > defaults
#   Model arch:     manifest (engine_dir) > auto-detect (tokenizer) > defaults
#
# In production, just set the paths below and run:
#   python -m engine.server --config engine.yaml
# =============================================================================

# --- Deployment paths (fill once per deployment) ---
paths:
  tokenizer_dir: workspace/models/Qwen3-TTS-12Hz-1.7B-CustomVoice
  weights_dir:   workspace/exported/custom-1.7b/weights
  engine_dir:    workspace/exported/custom-1.7b

server:
  port: 50051
  health_port: 8080              # HTTP health/metrics endpoint (0 to disable)
  max_sessions: 128
  request_timeout_sec: 120.0
  warmup_rounds: 3               # dummy inferences at startup to warm TRT cache

scheduler:
  max_batch_size: 128
  max_seq_len: 512
  # MLFQ dynamic priority
  mlfq_q1_threshold: 50     # steps before demotion Q0→Q1
  mlfq_q2_threshold: 200    # steps before demotion Q1→Q2
  mlfq_aging_interval: 100  # steps before anti-starvation boost
  mlfq_starvation_limit: 50 # max consecutive skips before force-schedule
  # Slot management
  max_idle_sec: 10.0         # evict slots idle longer than this
  max_queue_size: 256        # backpressure: reject new sessions beyond this
  session_timeout_sec: 300.0 # force-cancel sessions exceeding this duration

prefix_cache:
  enabled: true
  max_entries: 16            # number of distinct prefix KV entries to cache
  max_prefix_len: 512        # max token length for a cached prefix

spliter:
  ema_ratio_initial: 4.0
  ema_alpha: 0.1
  ema_overflow_alpha: 0.5
  max_concurrent_segments: 2
  prefill_len: 12
  # Min tokens before split at L1/L2/L3 punct — each is cap * ratio
  l1_split_cap_ratio: 0.70
  l2_split_cap_ratio: 0.80
  l3_split_cap_ratio: 0.90

sampling:
  do_sample: true
  temperature: 0.9
  repetition_penalty: 1.05
  top_k: 50
  random_seed: 0

# Prefill: CustomVoice client speaker missing / invalid (must exist in weights spk_id)
prefill:
  default_speaker: vivian
  fallback_speaker: vivian
